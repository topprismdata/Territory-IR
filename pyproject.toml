[project]
name = "territory-ir"
version = "0.3.0"
description = "TerritoryIR — 领地单元片编译/重演/调整核心（统一铺盖 → 真值片 → 条款 → 重演）"
requires-python = ">=3.10"
dependencies = ["shapely>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
include = ["territory_ir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local_data: 依赖本机大体积真实地理数据的测试（CI默认跳过）",
]
